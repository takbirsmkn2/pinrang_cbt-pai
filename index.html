<html lang="id"><head><meta charset="utf-8">

<title>CBT PAI – SMKN 2 Pinrang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#0f1f3d;--mut:#5b6b8a;--p:#1d4ed8;--p2:#1e3a8a;--ln:#d6e0f2;--ok:#15803d;--bad:#b91c1c;--sel:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#132038;--tx:#e6edf9;--mut:#9fb0cf;--ln:#26395c;--sel:#1e3a6e;--p:#4f83f5}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.hero{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;text-align:center;padding:22px 16px 40px}
.hero img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 3px 6px #0005)}
.hero h1{margin:8px 0 2px;font-size:1.3rem}.hero p{margin:0;opacity:.85;font-size:.9rem}
.wrap{max-width:960px;margin:-26px auto 24px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:0 6px 20px #1e3a8a14;margin-bottom:14px}
.login{max-width:440px;margin:-26px auto 24px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;padding:10px;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:10px;font-weight:600;cursor:pointer;min-width:90px}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px;color:var(--mut)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;font-size:1rem;background:var(--card);color:var(--tx)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:.95rem;cursor:pointer}
.btn.g{background:transparent;color:var(--p);border:1px solid var(--p)}.btn.r{background:var(--bad)}.btn.s{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.45}.full{width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.88rem;margin-top:10px;min-height:1em}.note{font-size:.8rem;color:var(--mut)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--p2);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;justify-content:space-between}
.top img{width:34px;height:34px;object-fit:contain}.top b{font-size:.9rem}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;background:#ffffff22;padding:4px 12px;border-radius:20px}.tm.w{background:var(--bad)}
.q{font-size:1.02rem}.ar{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-size:1.5rem;direction:rtl;display:block;line-height:2}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--ln);border-radius:12px;margin-top:9px;cursor:pointer}
.opt.on{background:var(--sel);border-color:var(--p)}.opt i{font-style:normal;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--ln);display:grid;place-items:center;flex:none;font-size:.85rem}
.opt.on i{background:var(--p);color:#fff}.opt.k{border-color:var(--ok);background:#16a34a1f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.n{padding:8px 0;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font-weight:600;cursor:pointer}.n.d{background:var(--sel);border-color:var(--p)}.n.c{background:var(--p);color:#fff}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.tok{font-size:2.4rem;letter-spacing:.3em;font-weight:800;color:var(--p);text-align:center;padding:10px;border:2px dashed var(--p);border-radius:14px;margin:10px 0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.st div{background:var(--sel);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:1.5rem;color:var(--p)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{background:var(--sel)}
.ov{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:20px}.ov .card{max-width:380px;text-align:center}
.big{font-size:3.4rem;font-weight:800;color:var(--p);text-align:center}
#app.ex{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
</style></head><body>

const Q=[
[`Perhatikan kutipan Q.S. Ali Imran ayat 190 berikut!${ar("إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ ...")}Lanjutan yang tepat untuk melengkapi ayat di atas adalah ....`,[ar("وَلَئِنْ كَفَرْتُمْ"),ar("لَآيَاتٍ لِأُولِي الْأَلْبَابِ"),ar("رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا"),ar("سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ"),ar("الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا")],1],
[`Berdasarkan Q.S. Ali Imran ayat 190, Allah memerintahkan manusia untuk merenungkan penciptaan langit dan bumi. Ciri utama "Ulul Albab" dalam konteks ayat ini jika dihubungkan dengan ilmu pengetahuan modern adalah ....`,["Menggunakan kecerdasannya untuk mengeksploitasi alam semesta secara maksimal","Mampu memadukan rasionalitas ilmu pengetahuan dengan zikir dan pengakuan atas kebesaran Allah","Fokus beribadah ritual (mahdhah) dan meninggalkan pembelajaran ilmu sains","Menghafalkan fenomena alam tanpa perlu mencari tahu manfaatnya bagi manusia","Menolak penemuan ilmiah baru yang dirasa tidak sesuai dengan pemikiran akalnya"],1],
[`Perhatikan potongan Q.S. Ibrahim ayat 7 berikut!${ar("وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ ...")}Lanjutan yang tepat untuk melengkapi ayat tentang syukur tersebut adalah ....`,[ar("إِنَّ عَذَابِي لَشَدِيدٌ"),ar("فَاذْكُرُونِي أَذْكُرْكُمْ"),ar("لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ"),ar("وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ"),ar("لَآيَاتٍ لِأُولِي الْأَلْبَابِ")],2],
[`Hukum tajwid pada lafal ${ar("لَئِن شَكَرْتُمْ")}dalam Q.S. Ibrahim ayat 7 adalah ....`,["Idzhar halqi, karena nun sukun bertemu huruf syin","Ikhfa hakiki, karena nun sukun bertemu huruf syin","Idgham bighunnah, karena nun sukun bertemu huruf syin","Idgham bilaghunnah, karena nun sukun bertemu huruf syin","Iqlab, karena nun sukun bertemu huruf syin"],1],
[`Allah menjanjikan tambahan nikmat bagi hamba-Nya yang bersyukur (Q.S. Ibrahim: 7). Bentuk implementasi <i>syukur bil arkan</i> (syukur dengan perbuatan/anggota badan) bagi seorang pelajar yang diberi kesehatan dan kecerdasan adalah ....`,["Mengucapkan \"Alhamdulillah\" setiap selesai mengerjakan ujian","Menyombongkan diri atas nilai bagus yang didapatkan agar orang lain termotivasi","Menggunakan waktu luang untuk belajar dan membantu menjelaskan pelajaran kepada teman","Membagikan sebagian harta jajannya secara diam-diam setiap hari raya saja","Menyimpan ilmunya sendiri agar tidak ada yang menyaingi prestasinya"],2],
[`Dalam kehidupan modern, sikap <i>hasad</i> (dengki) sering muncul akibat sering melihat pencapaian orang lain di media sosial. Secara psikologis dan spiritual (HOTS), mengapa orang yang ahli bersyukur selalu terhindar dari sifat <i>hasad</i>?`,["Karena ia tidak peduli sama sekali dengan urusan dan pencapaian orang lain","Karena ia sibuk mensyukuri nikmatnya sendiri dan ridha dengan takdir pembagian Allah","Karena ia merasa dirinya selalu lebih hebat dari orang lain","Karena ia takut nikmatnya dicabut jika ketahuan merasa dengki","Karena ia tidak memiliki akun media sosial sama sekali"],1],
[`"Lisan digital" atau jejak ketikan di media sosial memiliki dampak yang lebih luas dari sekadar ucapan mulut. Perilaku menjaga lisan digital yang tepat ketika menerima informasi <i>broadcast</i> yang memancing kemarahan adalah ....`,["Segera meneruskannya ke grup lain agar kewaspadaan masyarakat meningkat","Membalas pesan tersebut dengan makian kepada si pengirim","Mencari tahu kebenarannya terlebih dahulu (<i>tabayyun</i>) sebelum bertindak atau menyebarkan","Membaca lalu memblokir nomor pengirim pesan selamanya","Langsung menghapus aplikasi perpesanan dari gawai"],2],
[`Kasus (HOTS): Zaid mengetahui sebuah aib besar yang dilakukan oleh Umar di masa lalu. Kini, Umar telah bertobat sungguh-sungguh dan menjadi pribadi yang taat. Suatu hari, calon istri Umar bertanya kepada Zaid mengenai masa lalu Umar. Sikap terbaik Zaid sesuai syariat menutupi aib adalah ....`,["Menceritakan secara detail agar tidak ada unsur kebohongan pada calon istri","Menutupi aib masa lalu tersebut dan menonjolkan keshalehan Umar yang sekarang","Menyarankan calon istri tersebut membatalkan pernikahan demi keselamatannya","Meminta imbalan kepada Umar agar rahasianya tidak dibocorkan","Menyebarkan rahasia itu kepada orang lain agar tidak menjadi beban pikiran Zaid sendiri"],1],
[`Rasulullah SAW bersabda, "Barangsiapa menutupi aib seorang muslim di dunia, maka Allah akan ...." Kelanjutan hadits tersebut adalah ....`,["Menutupi aibnya di dunia dan di akhirat","Mengampuni dosa-dosa kedua orang tuanya","Melipatgandakan pahala puasanya","Memasukkannya ke dalam surga tanpa hisab","Menambahkan rezeki yang berkah baginya di dunia"],0],
[`Salah satu aib yang sering diumbar adalah aib keluarga sendiri dengan dalih mencari tempat curhat di media sosial. Hukum menceritakan aib suami/istri/keluarga ke ruang publik adalah ....`,["Mubah, jika tujuannya agar orang lain bisa mengambil pelajaran","Haram, karena keluarga adalah pakaian bagi satu sama lain yang harus dijaga kehormatannya","Sunnah, agar mendapatkan solusi dari banyak netizen","Makruh, karena tidak pantas didengar oleh anak-anak","Wajib, jika tujuannya untuk membela diri di hadapan masyarakat"],1],
[`Perkelahian atau tawuran antar pelajar seringkali dipicu oleh fanatisme buta (<i>ta’ashshub</i>) terhadap kelompok atau nama sekolah. Dalam sosiologi Islam, mengapa sifat fanatisme buta ini sangat dilarang?`,["Membutuhkan biaya besar untuk membuat identitas kelompok","Menjadikan siswa kurang fokus dalam meraih prestasi akademik di sekolah","Mengaburkan standar kebenaran, di mana seseorang akan membela kelompoknya meskipun jelas berbuat zalim","Menyebabkan kegiatan ekstrakurikuler di sekolah menjadi tidak berjalan maksimal","Membuat guru dan orang tua kehilangan wibawa di mata para pelajar"],2],
[`Kasus (HOTS): Budi melihat ada postingan dari siswa sekolah lain yang menghina nama sekolahnya. Banyak temannya yang terprovokasi untuk melakukan penyerangan fisik. Sebagai muslim yang menjunjung tinggi <i>Ukhuwah</i>, tindakan Budi seharusnya ....`,["Ikut merencanakan strategi penyerangan sebagai wujud kesetiaan kepada teman","Memilih diam agar tidak dijauhi oleh teman-temannya yang sedang marah","Mengingatkan teman-temannya untuk menahan diri dan melaporkan kasus provokasi tersebut kepada pihak sekolah berwenang","Menantang admin akun tersebut untuk duel satu lawan satu agar adil","Membuat akun palsu untuk membalas hinaan tersebut dengan kata-kata yang lebih kasar"],2],
[`Perkelahian pelajar berpotensi menghilangkan nyawa. Dalam ajaran Islam, ancaman bagi dua orang muslim yang berkelahi menggunakan senjata besi/tajam dengan niat saling membunuh adalah ....`,["Keduanya mendapatkan dosa kecil karena terbawa emosi remaja","Yang membunuh masuk neraka, yang terbunuh diampuni dosanya karena terzalimi","Hanya yang memulai provokasi yang menanggung seluruh dosa","Baik yang membunuh maupun yang terbunuh sama-sama masuk neraka karena keduanya berniat membunuh saudaranya","Hukuman diserahkan murni kepada penegak hukum negara tanpa hisab akhirat"],3],
[`Q.S. Al-Hujurat ayat 10 menegaskan bahwa sesungguhnya orang-orang beriman itu bersaudara. Solusi konkret yang ditawarkan ayat ini jika terjadi pertikaian antar dua kelompok adalah ....`,["Melakukan <i>ishlah</i> (mendamaikan keduanya) dan bertakwa kepada Allah","Menghukum pihak yang lebih kuat agar pihak yang lemah merasa puas","Mengisolasi kedua kelompok agar tidak pernah bertemu kembali","Membiarkan aparat menyelesaikan urusannya sendiri","Meminta ganti rugi materil sebesar-besarnya kepada pihak yang kalah"],0],
[`Upaya preventif (pencegahan) perkelahian pelajar yang paling efektif jika ditinjau dari sisi pembinaan mental keislaman adalah ....`,["Memperberat sanksi skorsing atau <i>drop out</i> (DO) bagi siswa yang terindikasi","Menyiagakan polisi di depan gerbang sekolah setiap waktu pulang","Mengadakan kegiatan kolaboratif antar sekolah seperti kajian agama gabungan dan bakti sosial","Membatasi secara ketat penggunaan gawai selama di lingkungan sekolah","Menambah jam pelajaran olahraga agar siswa kelelahan dan tidak sempat berkelahi"],2],
[`Dalam kitab <i>Fiqhus Sunnah Jilid 1</i> karya Sayyid Sabiq, Thaharah (bersuci) menurut syara' memiliki esensi dan tujuan utama. Tujuan hakiki dari disyariatkannya Thaharah adalah ....`,["Sebagai syarat mutlak sahnya berinteraksi sosial di masyarakat","Untuk mencegah berbagai macam penyakit menular","Syarat sahnya ibadah seperti shalat dan thawaf, serta bentuk pengagungan kepada Allah","Hanya sekadar rutinitas kebersihan jasmani pengganti mandi rutin","Sebagai metode relaksasi agar peredaran darah menjadi lancar"],2],
[`Sayyid Sabiq dalam <i>Fiqhus Sunnah</i> mengutip kesepakatan ulama tentang air yang suci dan menyucikan (Air Mutlaq). Berikut ini yang <b>bukan</b> termasuk sumber air mutlaq adalah ....`,["Air hujan (mata air dari langit)","Air laut yang asin","Air es atau salju yang mencair","Air kelapa dan air perasan buah-buahan","Air embun dan air sumur"],3],
[`Kasus (HOTS): Saat kemarau panjang, Ahmad hanya memiliki air bekas wudhu sebelumnya (air <i>musta'mal</i>) di dalam ember kecil. Menurut pandangan Sayyid Sabiq dalam <i>Fiqhus Sunnah</i>, status air <i>musta'mal</i> tersebut untuk dipakai berwudhu kembali adalah ....`,["Tetap suci dan menyucikan, sehingga sah digunakan berwudhu karena tidak berubah salah satu sifatnya","Najis mutawassitah, sehingga tidak boleh digunakan dan harus dibuang","Suci namun tidak menyucikan (tahir ghairu muthahhir), tidak sah untuk wudhu","Haram digunakan, dan Ahmad diwajibkan langsung tayamum walau air itu masih ada","Makruh menggunakannya jika ada air lain, namun haram jika bercampur sabun"],0],
[`Mengenai sisa air minum binatang peliharaan, Sayyid Sabiq menjelaskan hukum sisa air minum kucing (jilatan kucing) berdasarkan hadits Nabi SAW. Status air sisa minum kucing tersebut adalah ....`,["Najis mughallazah, wadahnya harus dicuci 7 kali dan dicampur tanah","Suci dan menyucikan, karena kucing termasuk binatang yang berkeliling di sekitar kita (binatang rumahan)","Najis mutawassitah, sehingga hanya perlu dicuci dengan sabun sekali","Makruh digunakan untuk bersuci namun suci jika terpaksa dimakan","Haram mutlak karena kucing sering memakan tikus dan kotoran"],1],
[`Ada kalanya air berubah karena tercampur benda suci seperti sabun, kapur barus, atau daun. Menurut <i>Fiqhus Sunnah</i>, jika perubahan air tersebut sangat dominan (misalnya berubah menjadi kuah teh atau kopi), maka hukum air tersebut adalah ....`,["Tetap suci dan menyucikan (boleh untuk wudhu)","Menjadi najis dan haram diminum","Suci zatnya, dapat dikonsumsi, namun tidak sah digunakan untuk bersuci (wudhu/mandi wajib)","Makruh digunakan bersuci namun tidak membatalkan ibadah","Tergantung niat orang yang mencampurnya"],2],
[`Di dalam <i>Fiqhus Sunnah Jilid 1</i>, Sayyid Sabiq merinci jenis-jenis benda yang dianggap najis (<i>An-Najaasah</i>). Berikut ini yang termasuk benda najis secara <i>dzatiyah</i> (zatnya najis) berdasarkan kesepakatan ulama adalah ....`,["Bangkai ikan dan belalang","Air liur kucing dan burung","Daging babi dan darah yang mengalir (jumlah banyak)","Sperma manusia (mani) menurut jumhur ulama","Keringat orang yang sedang berhadats besar"],2],
[`Madzi dan Wadi adalah cairan yang keluar dari kemaluan, namun berbeda dengan mani. Menurut Sayyid Sabiq, madzi (cairan bening yang keluar saat syahwat tanpa pancaran) dihukumi najis. Cara menyucikan anggota tubuh dan pakaian yang terkena madzi adalah ....`,["Wajib mandi junub (mandi besar) dan membuang pakaian tersebut","Cukup dengan memercikkan air ke bagian pakaian yang terkena dan mencuci kemaluannya lalu berwudhu","Dicuci dengan debu satu kali dan air enam kali","Cukup dilap dengan tisu kering tanpa perlu dibilas air","Harus direndam semalaman dengan sabun antiseptik"],1],
[`Kasus (HOTS): Seorang ibu menggendong bayi laki-lakinya yang baru berumur 4 bulan dan hanya mengonsumsi ASI (belum makan makanan lain). Tiba-tiba bayi tersebut kencing dan mengenai baju sang ibu. Berdasarkan <i>Fiqhus Sunnah</i>, langkah paling tepat dan praktis yang dilakukan ibu tersebut untuk menyucikan bajunya adalah ....`,["Mengganti baju tersebut dan mencucinya dengan sabun sampai hilang baunya","Membasuh baju tersebut dengan air mengalir sampai hilang wujud kencingnya","Cukup dengan memercikkan air (tanpa harus memerasnya) pada area baju yang terkena kencing tersebut","Mencuci baju tersebut dengan air tujuh kali salah satunya menggunakan tanah","Menjemur baju tersebut di bawah terik matahari sampai kering"],2],
[`Sayyid Sabiq menjelaskan tentang "Najis yang dimaafkan" (<i>ma'fu 'anhu</i>). Di bawah ini contoh najis yang dimaafkan dalam syariat Islam untuk mempermudah umat (HOTS) adalah ....`,["Darah haid yang menempel banyak di pakaian shalat","Kotoran ayam yang jelas basah di atas sajadah","Darah jerawat sedikit atau darah nyamuk yang menempel di baju saat shalat","Jilatan anjing pada piring makan jika sudah dikeringkan lap","Air kencing orang dewasa yang mengering di lantai namun masih bau"],2],
[`Babi dan anjing beserta air liurnya dihukumi sebagai najis berat (Mughallazah). Menurut petunjuk Rasulullah SAW yang ditulis dalam <i>Fiqhus Sunnah</i>, tata cara menyucikan bejana yang dijilat anjing adalah ....`,["Mencucinya tiga kali dengan air yang mengalir","Mencucinya tujuh kali basuhan, dan basuhan pertama (atau salah satunya) dicampur dengan tanah/debu","Merebus bejana tersebut dalam air mendidih agar bakteri hilang","Mengusapnya menggunakan batu yang suci dan kasar","Membakar bejana tersebut hingga menghitam lalu dicuci bersih"],1],
[`Islam sangat memperhatikan kebersihan tubuh hingga bagian-bagian detail. Hal ini tertuang dalam bab <i>Sunan al-Fitrah</i> (Sunnah-sunnah fitrah). Berikut ini yang <b>bukan</b> termasuk dalam sunnah fitrah menurut hadits riwayat Bukhari dan Muslim adalah ....`,["Mencukur bulu kemaluan (<i>istihdad</i>)","Memotong kuku","Mencabut bulu ketiak","Mewarnai seluruh rambut dengan warna hitam pekat","Memendekkan/mencukur kumis"],3],
[`Terkait dengan memendekkan kumis dan membiarkan jenggot (bagi laki-laki), hal tersebut disyariatkan dalam Islam. Hikmah utama dari anjuran membiarkan jenggot dan merapikan kumis dalam <i>Fiqhus Sunnah</i> adalah ....`,["Agar terlihat garang dan menakutkan bagi musuh","Untuk menyelisihi kebiasaan kaum Majusi dan musyrikin serta menjaga kewibawaan","Menjadikannya tren fashion di kalangan anak muda muslim","Agar mudah dikenali oleh sesama muslim saat bepergian ke luar negeri","Meningkatkan suhu kehangatan tubuh di musim dingin"],1],
[`Sayyid Sabiq menyebutkan batasan waktu maksimal untuk memotong kuku, mencabut bulu ketiak, dan mencukur bulu kemaluan agar tidak dibiarkan panjang. Batas waktu maksimal tersebut menurut hadits riwayat Anas bin Malik adalah ....`,["Tidak lebih dari 10 hari","Tidak lebih dari 20 hari","Tidak lebih dari 30 hari","Tidak lebih dari 40 malam (hari)","Ditentukan oleh kebiasaan masing-masing orang"],3],
[`Salah satu sunnah fitrah yang sangat ditekankan oleh Rasulullah SAW (bahkan hampir diwajibkan seandainya tidak memberatkan umatnya) adalah bersiwak. Waktu yang <b>paling</b> ditekankan untuk bersiwak (HOTS - penerapan ibadah) adalah ....`,["Setiap selesai makan besar saja","Hanya sebelum melaksanakan shalat Jumat","Saat akan mendirikan shalat, berwudhu, dan ketika bangun tidur (perubahan bau mulut)","Setiap keluar rumah untuk bekerja","Menjelang berbuka puasa di bulan Ramadhan"],2],
[`Mengenai khitan (sunat), para ulama memiliki beberapa pandangan yang dirangkum oleh Sayyid Sabiq. Pandangan yang paling kuat (rajih) mengenai hukum khitan bagi laki-laki dalam rangka menjaga thaharah/kesucian adalah ....`,["Sunnah muakkad (sangat dianjurkan)","Wajib (fardhu ain) karena berkaitan dengan sahnya thaharah dan ibadah shalat","Mubah (boleh dilakukan, boleh tidak)","Makruh jika dilakukan saat sudah dewasa","Haram jika menimbulkan rasa sakit yang berlebih"],1]
];
const N=Q.length,DUR=3600000,MAXV=3,KELAS=["XI APAT 1","XI APAT 2","XI APAT 3"],LT="abcde",PH="643edba553ee2d1d96a72471490c28e5223bac35251f95982439aacc436043e9";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=n=>n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,100);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L={get(k){try{return JSON.parse(localStorage.getItem("cbt:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("cbt:"+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("cbt:"+k)}catch(e){}}};
let db=null,usr=null,run=null,pos=0,tick=null,chk=null,scr="login",vlock=0,dtimer=null,ready=false,fails=0,lockT=0;
const S={
 async get(p){if(db){const s=await db.doc(p).get();return s.exists?s.data():null}return L.get(p)},
 async set(p,d){if(db)await db.doc(p).set(d);else L.set(p,d)},
 async del(p){if(db)await db.doc(p).delete();else L.del(p)},
 async list(c){if(db){const s=await db.collection(c).get();return s.docs.map(x=>({id:x.id,...x.data()}))}
  return Object.keys(localStorage).filter(k=>k.startsWith("cbt:"+c+"/")).map(k=>({id:k.split("/")[1],...JSON.parse(localStorage[k])}))}
};
const head=(sub)=>`<div class="hero"><img src="${LOGO}" alt="Logo SMKN 2 Pinrang"><h1>Computer Based Test (CBT)</h1><p>${sub||"SMK Negeri 2 Pinrang · Pendidikan Agama Islam dan Budi Pekerti"}</p></div>`;
async function init(){
 render();
 try{if(window.claude){db=await claude.use("db");usr=await claude.use("user")}}catch(e){db=null}ready=true;
 const r=L.get("run");if(r&&!r.done&&Date.now()<r.start+DUR){run=r;pos=r.pos||0;startExam()}
 else render();
}
function render(tab){
 scr="login";const t=tab||"siswa";
 app.className="";app.innerHTML=`${head()}<div class="login"><div class="card">
 <div class="tabs"><button class="tab ${t=="siswa"?"on":""}" onclick="render('siswa')">Portal Siswa</button><button class="tab ${t=="guru"?"on":""}" onclick="render('guru')">Portal Guru</button></div>
 ${t=="siswa"?`<label>Nama Lengkap</label><input id="nm" maxlength="60" placeholder="Ketik nama lengkap" autocomplete="off">
 <label>Kelas</label><select id="kl">${KELAS.map(k=>`<option>${k}</option>`).join("")}</select>
 <label>Token Ujian</label><input id="tk" placeholder="Token dari guru" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">
 <div class="err" id="er"></div><button class="btn full" onclick="loginSiswa()">Mulai Ujian</button>
 ${ready&&!db?`<p class="err">⚠ Mode lokal: data bersama tidak tersambung. Buka tautan ujian melalui akun/tautan yang diizinkan guru.</p>`:""}<p class="note">30 soal pilihan ganda · waktu 60 menit · soal dan pilihan jawaban diacak. Jangan berpindah aplikasi atau membuka layar ganda selama ujian.</p>`
 :`<label>Password Guru</label><input id="pw" type="password" placeholder="Masukkan password"><div class="err" id="er"></div><button class="btn full" onclick="loginGuru()">Masuk Dasbor</button>`}
 </div></div>`;
}
async function loginSiswa(){
 const nama=$("#nm").value.trim().replace(/\s+/g," "),kelas=$("#kl").value,tok=$("#tk").value.trim().toUpperCase(),er=$("#er");
 if(!ready)return er.textContent="Sedang menghubungkan ke server, tunggu sebentar lalu coba lagi.";if(nama.length<3||!slug(nama))return er.textContent="Nama lengkap wajib diisi.";if(!tok)return er.textContent="Token wajib diisi.";
 er.textContent="Memeriksa...";
 try{
  const cfg=await S.get("config/token");if(!cfg||cfg.kode!==tok)return er.textContent="Token salah atau belum dibuat oleh guru.";
  const id=slug(nama),ses=await S.get("sesi/"+id),old=L.get("run");
  if(ses){if(old&&old.id===id&&old.sid===ses.sid&&!old.done){run=old;run.start=ses.mulai||run.start;run.viol=Math.max(run.viol,ses.pelanggaran||0)}else return er.textContent="Nama ini sudah pernah mengakses soal. Hubungi guru untuk reset.";}
  else{
   const sid=Math.random().toString(36).slice(2,10),ord=shuf([...Array(N).keys()]),perm={};ord.forEach(i=>perm[i]=shuf([0,1,2,3,4]));
   run={id,nama,kelas,sid,order:ord,perm,ans:{},start:Date.now(),viol:0,pos:0,done:false};
   await S.set("sesi/"+id,{nama,kelas,sid,status:"mulai",mulai:run.start,pelanggaran:0});const ck=await S.get("sesi/"+id);if(ck&&ck.sid!==sid)return er.textContent="Nama ini sedang dipakai di perangkat lain. Hubungi guru.";
  }
  L.set("run",run);pos=run.pos||0;
  try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
  startExam();
 }catch(e){er.textContent=e&&e.code==="not_granted"?"Akses ditolak: guru perlu memberi izin interaksi (Contributor) pada halaman ini.":"Gagal terhubung. Coba lagi. ("+(e.message||e.code||"error")+")"}
}
function startExam(){scr="exam";vlock=Date.now()+2000;drawExam();clearInterval(tick);clearInterval(chk);tick=setInterval(timer,1000);timer();
 chk=setInterval(async()=>{try{const s=await S.get("sesi/"+run.id);if(!s||s.sid!==run.sid){stop();L.del("run");alert("Pekerjaan Anda telah direset oleh guru. Silakan login kembali.");render()}else{run.start=s.mulai||run.start;if((s.pelanggaran||0)>run.viol){run.viol=s.pelanggaran;L.set("run",run)}}}catch(e){}},20000)}
function stop(){clearInterval(tick);clearInterval(chk);scr="x"}
function timer(){if(!run)return;const m=run.start+DUR-Date.now();if(m<=0){finish("Waktu habis");return}
 const e=$("#tm");if(e){const s=Math.floor(m/1000);e.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");e.classList.toggle("w",m<300000)}}
function drawExam(){
 const qi=run.order[pos],q=Q[qi],pm=run.perm[qi],cur=run.ans[qi];
 app.className="ex";
 app.innerHTML=`<div class="top"><div style="display:flex;gap:8px;align-items:center"><img src="${LOGO}" alt=""><div><b>${esc(run.nama)}</b><div style="font-size:.72rem;opacity:.8">${run.kelas}</div></div></div><div class="tm" id="tm">--:--</div></div>
 <div class="wrap" style="margin-top:14px"><div class="card"><div class="note">Soal ${pos+1} dari ${N}</div><div class="q">${q[0]}</div>
 ${pm.map((o,d)=>`<div class="opt ${cur===o?"on":""}" onclick="pick(${o})"><i>${LT[d].toUpperCase()}</i><div>${q[1][o]}</div></div>`).join("")}
 <div class="row"><button class="btn g" onclick="go(${pos-1})" ${pos==0?"disabled":""}>← Sebelumnya</button>${pos<N-1?`<button class="btn" onclick="go(${pos+1})">Selanjutnya →</button>`:`<button class="btn r" onclick="confirmEnd()">Selesai</button>`}</div></div>
 <div class="card"><div class="note" style="margin-bottom:8px">Navigasi soal · terjawab ${Object.keys(run.ans).length}/${N}</div><div class="grid">${run.order.map((x,i)=>`<button class="n ${run.ans[x]!==undefined?"d":""} ${i==pos?"c":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
 <button class="btn r full" onclick="confirmEnd()">Kumpulkan Jawaban</button></div></div>`;
 timer();
}
function pick(o){const y=scrollY;run.ans[run.order[pos]]=o;run.pos=pos;L.set("run",run);drawExam();scrollTo(0,y)}
function go(i){if(i<0||i>=N)return;pos=i;run.pos=i;L.set("run",run);drawExam();scrollTo(0,0)}
function confirmEnd(){const k=N-Object.keys(run.ans).length;
 ov(`<h3>Kumpulkan jawaban?</h3><p>${k?`Masih ada <b>${k}</b> soal belum dijawab.`:"Semua soal sudah dijawab."} Setelah dikumpulkan, jawaban tidak dapat diubah.</p><button class="btn g" onclick="ov()">Kembali</button> <button class="btn r" onclick="ov();finish('Dikumpulkan siswa')">Ya, Kumpulkan</button>`)}
function ov(h){let e=$("#ov");if(!h){e&&e.remove();return}if(!e){e=document.createElement("div");e.id="ov";e.className="ov";document.body.appendChild(e)}e.innerHTML=`<div class="card">${h}</div>`}
async function finish(alasan){
 if(!run||run.done)return;run.done=true;stop();L.set("run",run);ov();
 let saveErr=false,b=0;Q.forEach((q,i)=>{if(run.ans[i]===q[2])b++});const nilai=Math.round(b/N*100),kosong=N-Object.keys(run.ans).length;
 try{await S.set("hasil/"+run.id,{nama:run.nama,kelas:run.kelas,benar:b,salah:N-b-kosong,kosong,nilai,selesai:Date.now(),alasan,pelanggaran:run.viol});
  await S.set("sesi/"+run.id,{nama:run.nama,kelas:run.kelas,sid:run.sid,status:"selesai",mulai:run.start,pelanggaran:run.viol})}catch(e){saveErr=true}
 app.className="";app.innerHTML=`${head()}<div class="login"><div class="card" style="text-align:center"><h2>Ujian Selesai</h2><p>${esc(run.nama)} · ${run.kelas}</p><div class="big">${nilai}</div><p>Benar <b>${b}</b> · Salah <b>${N-b-kosong}</b> · Kosong <b>${kosong}</b></p>${saveErr?`<p class="err">⚠ Nilai belum tersimpan ke server. Beri tahu guru sebelum menutup halaman ini.</p>`:""}<p class="note">${esc(alasan)}. Terima kasih, silakan tutup halaman ini.</p></div></div>`;
 try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
}
function viol(why){
 if(scr!=="exam"||!run||run.done||Date.now()<vlock)return;vlock=Date.now()+1500;run.viol++;L.set("run",run);
 S.set("sesi/"+run.id,{nama:run.nama,kelas:run.kelas,sid:run.sid,status:"mulai",mulai:run.start,pelanggaran:run.viol}).catch(()=>{});
 if(run.viol>=MAXV){finish("Otomatis dikumpulkan: berpindah layar/aplikasi "+MAXV+" kali");return}
 ov(`<h3 style="color:var(--bad)">⚠ Peringatan ${run.viol}/${MAXV}</h3><p>Terdeteksi Anda meninggalkan halaman ujian (${why}). Pada pelanggaran ke-${MAXV} ujian otomatis dikumpulkan.</p><button class="btn" onclick="vlock=Date.now()+1500;ov()">Kembali ke Soal</button>`);
}

addEventListener("blur",()=>viol("layar ganda/aplikasi lain"));

addEventListener("contextmenu",e=>{if(scr==="exam")e.preventDefault()});

addEventListener("keydown",e=>{if(scr==="exam"&&(e.ctrlKey||e.metaKey||e.key==="F12"||e.key==="PrintScreen"))e.preventDefault()});
addEventListener("beforeunload",e=>{if(scr==="exam"){e.preventDefault();e.returnValue=""}});

let tabG="token",fK="Semua";
async function loginGuru(){const er=$("#er");if(Date.now()<lockT)return er.textContent="Terlalu banyak percobaan. Tunggu "+Math.ceil((lockT-Date.now())/1000)+" detik.";
 let h;try{h=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode($("#pw").value)))).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return er.textContent="Peramban tidak mendukung verifikasi."}
 if(h!==PH){if(++fails>=5){lockT=Date.now()+30000;fails=0}return er.textContent="Password salah."}fails=0;dash()}
async function dash(t){
 if(t)tabG=t;scr="guru";clearInterval(dtimer);app.className="";
 const own=usr?usr.isOwner():true;
 const bar=`<div class="note" style="margin-bottom:10px">${db?(own?"Mode data bersama (terhubung).":"⚠ Data bersama aktif, tetapi Anda bukan pemilik halaman: membuat token dan reset mungkin ditolak. Buka dari akun pemilik."):"⚠ Mode lokal (belum ada database bersama): data hanya tersimpan di perangkat ini."}</div>`;
 let body="";
 if(tabG==="token"){const c=await S.get("config/token").catch(()=>null);
  body=`<h3>Token Ujian Aktif</h3><div class="tok">${c?c.kode:"— belum ada —"}</div><div style="text-align:center"><button class="btn" onclick="newTok()">Buat Token Baru</button></div><p class="note">Bagikan token ini kepada siswa. Token hanya terlihat di dasbor guru. Membuat token baru membuat token lama tidak berlaku untuk siswa yang belum login.</p>`}
 else if(tabG==="rekap"){body='<div id="rk">'+await rekap()+'</div>'}
 else{body=`<h3>Daftar Soal & Kunci Jawaban</h3>`+Q.map((q,i)=>`<div class="card" style="padding:12px"><b>${i+1}.</b> ${q[0]}${q[1].map((o,d)=>`<div class="opt ${d==q[2]?"k":""}" style="cursor:default"><i>${LT[d].toUpperCase()}</i><div>${o}</div></div>`).join("")}</div>`).join("")}
 app.innerHTML=`${head("Dasbor Guru · SMK Negeri 2 Pinrang")}<div class="wrap"><div class="card">${bar}<div class="tabs">${[["token","Token"],["rekap","Rekap Nilai"],["soal","Soal & Kunci"]].map(([k,n])=>`<button class="tab ${tabG==k?"on":""}" onclick="dash('${k}')">${n}</button>`).join("")}<button class="tab" onclick="render()">Keluar</button></div>${body}</div></div>`;
 if(tabG==="rekap")dtimer=setInterval(async()=>{if(scr!=="guru"||tabG!=="rekap"){clearInterval(dtimer);return}const h=await rekap();const e=$("#rk");if(e)e.innerHTML=h},15000);
}
async function newTok(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let k="";for(let i=0;i<6;i++)k+=c[Math.floor(Math.random()*c.length)];
 try{await S.set("config/token",{kode:k,ts:Date.now()})}catch(e){alert("Gagal menyimpan token. Pastikan Anda membuka sebagai pemilik halaman.")}dash()}
let rows=[];
async function data(){const [s,h]=await Promise.all([S.list("sesi"),S.list("hasil")]);const hm={};h.forEach(x=>hm[x.id]=x);
 rows=s.map(x=>({id:x.id,nama:String(x.nama),kelas:String(x.kelas),status:x.status==="selesai"?"Selesai":"Mengerjakan",benar:hm[x.id]?(+hm[x.id].benar||0):"-",nilai:hm[x.id]?(+hm[x.id].nilai||0):"-",pel:+(hm[x.id]?hm[x.id].pelanggaran:x.pelanggaran)||0,ket:hm[x.id]?hm[x.id].alasan:""})).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama));return rows}
async function rekap(){
 try{await data()}catch(e){return `<p class="err">Gagal memuat data.</p>`}
 const f=rows.filter(r=>fK==="Semua"||r.kelas===fK),sl=f.filter(r=>r.nilai!=="-"),avg=sl.length?Math.round(sl.reduce((a,r)=>a+r.nilai,0)/sl.length):0;
 return `<div class="st"><div><b>${f.length}</b>Peserta</div><div><b>${sl.length}</b>Selesai</div><div><b>${avg}</b>Rata-rata</div><div><b>${sl.length?Math.max(...sl.map(r=>r.nilai)):0}</b>Tertinggi</div></div>
 <div class="row" style="margin:0 0 10px"><select style="max-width:200px" onchange="fK=this.value;dash()">${["Semua",...KELAS].map(k=>`<option ${k==fK?"selected":""}>${k}</option>`).join("")}</select><div><button class="btn s" onclick="expCSV()">⬇ CSV</button> <button class="btn s" onclick="expPDF()">⬇ PDF</button> <button class="btn s g" onclick="dash()">⟳</button></div></div>
 <div class="tw"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Benar</th><th>Nilai</th><th>Pelanggaran</th><th>Aksi</th></tr>
 ${f.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(r.status)}</td><td>${r.benar}</td><td><b>${r.nilai}</b></td><td>${r.pel}</td><td><button class="btn s r" data-i="${esc(r.id)}" onclick="reset(this.dataset.i)">Reset</button></td></tr>`).join("")||`<tr><td colspan="8">Belum ada peserta.</td></tr>`}</table></div>`}
async function reset(id){if(!confirm("Reset pekerjaan siswa ini? Siswa dapat mengerjakan ulang dari awal."))return;
 try{await S.del("sesi/"+id);await S.del("hasil/"+id)}catch(e){alert("Gagal reset (hanya pemilik halaman yang dapat menghapus data).")}
 const r=L.get("run");if(r&&r.id===id)L.del("run");dash()}
async function save(name,data,type){try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:name,data:new Blob([data],{type})});return}}catch(e){if(e&&e.code==="declined")return}
 alert("Unduhan tidak tersedia di tampilan ini. Buka halaman melalui claude.ai pada peramban.")}
async function expCSV(){await data();const f=rows.filter(r=>fK==="Semua"||r.kelas===fK);
 const c=[["No","Nama","Kelas","Status","Benar","Nilai","Pelanggaran","Keterangan"],...f.map((r,i)=>[i+1,r.nama,r.kelas,r.status,r.benar,r.nilai,r.pel,r.ket])].map(a=>a.map(v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`}).join(",")).join("\n");
 save("rekap_nilai_PAI_XI.csv","\ufeff"+c,"text/csv")}
async function expPDF(){await data();const f=rows.filter(r=>fK==="Semua"||r.kelas===fK);
 if(!window.jspdf){alert("Pustaka PDF belum termuat.");return}
 const d=new jspdf.jsPDF();try{d.addImage(LOGO,"PNG",14,10,20,20)}catch(e){}
 d.setFontSize(13);d.text("Rekap Nilai CBT PAI dan Budi Pekerti",40,17);d.setFontSize(10);d.text("SMK Negeri 2 Pinrang · "+(fK==="Semua"?"Semua Kelas":fK)+" · "+new Date().toLocaleDateString("id-ID"),40,24);
 d.autoTable({startY:34,head:[["No","Nama","Kelas","Status","Benar","Nilai","Pelanggaran"]],body:f.map((r,i)=>[i+1,r.nama,r.kelas,r.status,r.benar,r.nilai,r.pel]),headStyles:{fillColor:[29,78,216]},styles:{fontSize:9}});
 save("rekap_nilai_PAI_XI.pdf",d.output("blob"),"application/pdf")}
init();
</script></body></html>
